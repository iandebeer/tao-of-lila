name: Build and deploy static sites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production uploads so an older run cannot overwrite a newer one.
concurrency:
  group: static-sites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static sites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/reading-site/package-lock.json
      - name: Install reading site dependencies
        run: npm ci --prefix web/reading-site
      - name: Build reading room and landing page
        run: |
          npm run build --prefix web/reading-site
          npm run build --prefix web/landing-site
      - name: Check published pages and artwork
        run: node scripts/check-static-sites.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: static-sites
          path: |
            web/reading-site/dist
            web/landing-site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ${{ matrix.project }}
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: reading-site
            project: leela-reading
          - site: landing-site
            project: leela-landing
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. See docs/custom-domains.md.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: static-sites
          path: static-sites
      - name: Publish production pages
        env:
          SITE: ${{ matrix.site }}
          PROJECT: ${{ matrix.project }}
        run: npx --yes wrangler@4 pages deploy "static-sites/$SITE/dist" --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
