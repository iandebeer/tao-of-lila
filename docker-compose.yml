services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tao_of_lila
      POSTGRES_USER: tao
      POSTGRES_PASSWORD: tao
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tao -d tao_of_lila"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - tao-of-lila-postgres:/var/lib/postgresql/data

volumes:
  tao-of-lila-postgres:
